# Hoot native-player configuration reference.
#
# Every supported hootplay setting is listed below and is DISABLED by default.
# Enable a setting by removing the leading '# ' and changing the value when needed.
# If a setting stays commented out, hootplay uses catalog metadata, automatic
# detection, an existing environment value, or the built-in default.
#
# Native first start creates ~/.hoot. If ./catalog and/or ./hootplay.ini exist,
# they are imported there once without overwriting existing user files.
# Configuration search order:
#   1. --config /path/to/hootplay.ini
#   2. HOOTPLAY_CONFIG environment variable
#   3. ~/.hoot/hootplay.ini
#   4. ./hootplay.ini
#   5. hootplay.ini next to the executable (legacy fallback)
#
# Relative file paths are resolved relative to this configuration file.
# Command-line options remain available as one-run overrides.

[general]
# Optional XML override file loaded on top of the catalog.
# override_xml = hoot-overrides.xml

[player]
# Catalog file. Built-in default: catalog/hoot.sqlite.zst
# catalog = catalog/hoot.sqlite.zst

# Directory containing Hoot pack ZIP files. Built-in default: current directory.
# packs = packs

# Fixed catalog entry/archive. Leave disabled to select it on the command line.
# entry = asuka68snd-generic-2

# Output sample rate in Hz. Built-in default: 44100.
# sample_rate = 44100

# Track number, one-based as presented by hootplay. Built-in default: 1.
# track = 1

# List matching catalog entries instead of starting playback.
# list = false

# Mute percussion channels where the active driver supports this control.
# mute_percussion = false

# Channel selection/mute expression used by supported drivers, e.g. 3 or 2-5.
# channels = 2-5

# Render to a WAV file instead of live playback.
# wav = captures/track.wav

# WAV render duration in seconds. Required when wav is enabled.
# seconds = 30

[gui]
# Optional TrueType/OpenType font used by hootui for full UTF-8/Japanese text.
# If disabled, hootui automatically searches common Japanese-capable system fonts.
# font = fonts/NotoSansCJK-Regular.ttc

[midi]
# Enable or disable MIDI transport irrespective of catalog metadata. Applies to X68000 and PC-98 MIDI hosts.
# enabled = true

# MIDI synth backend: auto, cm64, cm32p, munt, vermouth, nuked-sc55, fluidsynth, or none.
# auto selects Munt for MT-32, full CM-64 (Munt CM-32L + built-in CM-32P) when both ROM sets
# are available, native Vermouth for midiout_type 6 when installed, Nuked-SC55 (with FluidSynth
# fallback) for SC-55, and FluidSynth for SC-88/GM.
# For CM-64, auto falls back to the older CM-32L-only Munt path if CM-32P ROMs are absent.
# Hoot warns only when the selected pack/configuration needs these ROMs; named SN-U110-07/-10
# variants also report the specific missing expansion-card ROM and the expected audio impact.
# backend = auto

# Optional explicit Munt/mt32emu shared-library path. Normally dynamic library discovery is sufficient.
# mt32emu_library = lib/libmt32emu.so

# Optional native Vermouth shared-library path for X68000 midiout_type 6. Hoot can use either
# the historical GUS/TiMidity-style implementation or a modern compatible drop-in.
# vermouth_library = lib/vermouth.dll

# Vermouth module-creation ABI. "legacy" uses the original sample-rate-only API and expects
# timidity.cfg plus GUS patch files. "fluidsynth" uses the modern SF2-path API.
# vermouth_abi = legacy

# SoundFont for a modern FluidSynth-based Vermouth drop-in. If omitted, midi.soundfont is reused.
# This is not used by the legacy GUS/TiMidity Vermouth implementation.
# vermouth_soundfont = soundfonts/GeneralUser_GS.sf2

# Shared fallback directory containing user-supplied Munt ROM images.
# munt_rom_path = roms/munt

# Preferred MT-32 ROM directory. Keep a compatible control ROM and PCM ROM here.
# mt32_rom_path = roms/mt32

# Preferred CM-32L ROM directory. Used for the LA half of Hoot CM-64 midiout_type 3.
# cm32l_rom_path = roms/cm32l

# Preferred CM-32P PCM ROM directory. Supply the three 512 KiB IC18/IC19/IC20 raw dumps.
# The CM-32P control/firmware ROM is not required by Hoot's high-level MIDI implementation.
# cm32p_rom_path = roms/cm32p

# Optional generic SN-U110 expansion-card ROM (up to 512 KiB), using the original scrambled dump format.
# Used for CM-32P/CM-64 entries that do not name a specific card.
# cm32p_card_rom = roms/cm32p/SN-U110.bin

# Card-specific ROMs. Hoot automatically selects these when an entry title names
# SN-U110-07 or SN-U110-10; the generic card path remains the fallback.
# cm32p_card_rom_07 = roms/cm32p/SN-U110-07.bin
# cm32p_card_rom_10 = roms/cm32p/SN-U110-10.bin

# Optional exact Munt machine IDs. Leave disabled for automatic ROM-compatible selection.
# mt32_machine = mt32_1_07
# cm32l_machine = cm32l_1_02

# Preferred FluidSynth SoundFont shared by X68000 and PC-98 GM/GS playback.
# SC-88 (midiout_type 7) currently uses this only as compatibility rendering;
# Hoot emits a runtime warning because this is not hardware-exact SC-88 synthesis.
# soundfont = soundfonts/GeneralUser_GS.sf2

# Optional X68000 Korg M1 compatibility SoundFont. Hoot midiout_type 5 uses this
# before the generic SoundFont. This can approximate game-specific M1 timbres,
# but it is not a hardware-exact M1 renderer; authentic output requires a licensed
# Korg M1-compatible hardware/software synth with the original PCM/program content.
# m1_soundfont = soundfonts/Korg_M1_compatible.sf2

# Legacy generic MIDI SoundFont fallback. Normally leave this disabled.
# legacy_soundfont = soundfonts/GeneralUser_GS.sf2

# Explicit Nuked-SC55 CLAP plugin path.
# nuked_sc55_clap = plugins/Nuked-SC55.clap

# Directory containing the user's Sound Canvas ROM files.
# soundcanvas_rom_path = roms/sc55

# Nuked-SC55 model, for example: v1.00, v1.10, v1.20, v1.21, v2.00, mk2.
# sc55_model = v1.21

# MIDI contribution to the final mix. Current built-in default: 0.70.
# gain = 0.70

# Additional CLAP plugin search path. Use the platform's path-list separator.
# clap_path = /usr/local/lib/clap

[x68k]
# Optional mdxmini shared library for x68k/mxdrv catalogue entries. If omitted,
# Hoot searches the normal system library path. Example:
# mdxmini_library = lib/libmdxmini.so

# Human68k .X loader mode. Normal operation uses automatic/relocated loading.
# Diagnostic alternatives currently include raw-file and raw-body.
# x_load_mode = auto

# Emulated 68000 clock in Hz. Built-in default: 10000000.
# cpu_clock = 10000000

# YM2151 clock in Hz. Built-in default: 4000000.
# ym2151_clock = 4000000

# YM2151 core selection. Use nuked to request the Nuked OPM core.
# ym2151_core = nuked

# Force PCM8 support on or off instead of using catalog metadata.
# pcm8 = true

# MFP core override: hoot/legacy or mame/mc68901.
# mfp_core = hoot

# MFP bootstrap policy. true selects the Hoot-compatible bootstrap.
# mfp_bootstrap = true

# Ignore catalog-provided MFP overrides.
# mfp_ignore_overrides = false

# Startup policy: auto, native/human68k, or hoot/legacy/direct.
# startup = auto

# YM2151/OPM contribution to the final mix. Catalog opm_mix normally wins first.
# opm_gain = 0.75

# Standard X68000 ADPCM contribution to the final mix.
# adpcm_gain = 0.40

# PCM8 contribution to the final mix.
# pcm8_gain = 0.40

# Final X68000 output gain applied after chip mixing.
# total_gain = 1.0

# Detailed X68000 trace output file.
# trace = logs/x68k.trace

# Maximum number of X68000 trace events.
# trace_limit = 10000

[psg]
# Disable PSG/SSG output completely.
# disabled = false

# Solo the PSG/SSG part by suppressing the FM contribution where supported.
# solo = false

# PSG channels to keep enabled. Accepted channel symbols include A/B/C or 0/1/2.
# channels = ABC

# Legacy alias for PSG channel selection. Prefer channels above.
# only = ABC

# PSG/SSG gain. Supported cores clamp this to the range 0.0-4.0.
# gain = 0.90

# Invert PSG/SSG polarity.
# invert = false

# Enable PSG tone generation. false disables tone for diagnostics.
# tone = true

# Enable PSG noise generation. false disables noise for diagnostics.
# noise = true

# Disable the PSG DC-removal path for raw diagnostic output.
# raw = false

[pc98]
# Full PC-98 driver trace output file.
# trace = logs/pc98.trace

# Maximum number of full PC-98 trace events. Driver default: 20000.
# trace_limit = 20000

# Enable OPNA register tracing to stderr/diagnostic output.
# trace_opn = false

# Maximum OPNA trace events. Driver default: 512.
# trace_opn_limit = 512

# Enable DOS-call tracing.
# trace_dos = false

# Disable the PC-98 OPN total-level compatibility adjustment.
# disable_opn_tl_compat = false

# Override the Micro Cabin MMD timer rate in Hz.
# mmd_timer_hz = 120.0

# PC-98 PIT speaker/buzzer gain. 1.0 is the calibrated default.
# beep_gain = 1.0

# Print unsupported x86 opcodes when encountered.
# trace_x86_unsupported = false

[pc88]
# Override the generic PC-88 FM-timer interrupt bus value.
# irq_bus = 0x08

# Generic PC-88 trace output file.
# trace = logs/xak2.trace

# Maximum generic PC-88 trace events.
# trace_limit = 10000

[environment]
# Advanced escape hatch. Any variable placed here is passed through verbatim.
# Normally this section should remain empty because supported runtime controls
# have named settings above.
#
# EXAMPLE_ONLY = value
